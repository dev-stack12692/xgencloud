<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account - XgenCloud</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1014; color: #e8eaed;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #14171c; border: 1px solid #232830; border-radius: 12px;
          padding: 28px; width: 340px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 .x { color: #f5b942; }
  p.sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #9aa0a6; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3038;
          background: #0d1014; color: #e8eaed; font-size: 14px; }
  input:focus { outline: none; border-color: #f5b942; }
  button { width: 100%; margin-top: 18px; padding: 10px 0; border: 0; border-radius: 8px;
           background: #f5b942; color: #14171c; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #ef5350; font-size: 13px; min-height: 16px; margin-top: 10px; }
  .note { color: #9aa0a6; font-size: 13px; min-height: 16px; margin-top: 10px; }
  .alt { margin-top: 14px; font-size: 13px; color: #9aa0a6; text-align: center; }
  .alt a { color: #f5b942; text-decoration: none; }
  .pvbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
           background: #f5b942; color: #14171c; font-size: 12px; font-weight: 600;
           text-align: center; padding: 7px 12px; }
</style>
</head>
<body>
<div class="pvbar">Static preview - accounts, orders and payments are not live yet.</div>

<div class="card">
  <h1><span class="x">Xgen</span>Cloud</h1>
  <p class="sub">Create your account</p>
  <form id="f" method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="new-password" required>
    <button id="go" type="submit">Create account</button>
  </form>
  <div class="err" id="err"></div>
  <div class="note" id="note"></div>
  <div class="alt">Already have an account? <a href="login.html">Sign in</a></div>
  <div class="alt"><a href="index.html">Back to home</a></div>
</div>
<script>
var f = document.getElementById('f');
f.addEventListener('submit', function (ev) {
  ev.preventDefault();
  document.getElementById('err').textContent = 'Preview only - the backend is not live yet.';
});
</script>
</body>
</html>
