<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your account - XgenCloud</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e13; color: #e8eaed;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1;
                 background: url("bg-clouds.webp") center/cover no-repeat;
                 opacity: .07; pointer-events: none; }
  .card { background: #14171c; border: 1px solid #232830; border-radius: 12px;
          padding: 28px; width: 420px; max-width: calc(100vw - 32px); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 .x { color: #f5b942; }
  p.sub { color: #9aa0a6; font-size: 13px; margin: 0 0 20px; }
  .row { display: flex; justify-content: space-between; gap: 16px;
         padding: 10px 0; border-bottom: 1px solid #232830; font-size: 14px; }
  .row .k { color: #9aa0a6; }
  .row .v { text-align: right; word-break: break-all; }
  .row .v a { color: #f5b942; text-decoration: none; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .btn { display: block; text-align: center; padding: 10px 0; border-radius: 8px;
         background: #f5b942; color: #14171c; font-weight: 600; font-size: 14px;
         text-decoration: none; border: 0; cursor: pointer; }
  .btn.ghost { background: transparent; color: #9aa0a6; border: 1px solid #2a3038; }
  .btn.ghost:hover { color: #e8eaed; border-color: #f5b942; }
  .alt { margin-top: 14px; font-size: 13px; color: #9aa0a6; text-align: center; }
  .alt a { color: #f5b942; text-decoration: none; }
  .pvbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50;
           background: #f5b942; color: #14171c; font-size: 12px; font-weight: 600;
           text-align: center; padding: 7px 12px; }
</style>
</head>
<body>
<div class="pvbar">Static preview - accounts, orders and payments are not live yet.</div>

<div class="card">
  <h1><span class="x">Xgen</span>Cloud</h1>
  <p class="sub">Your account</p>
  <div class="row"><span class="k">Email</span><span class="v">ui-user@test.dev</span></div>
  <div class="row"><span class="k">Plan</span><span class="v">1 GB RAM / 5 GB Disk / 1 vCore</span></div>
  <div class="row"><span class="k">Service</span><span class="v">ui-site-1 (running)</span></div>
  <div class="actions">
    <a class="btn" href="my_orders.html">My orders</a>
    <a class="btn" href="index.html#pricing">New order</a>
    <button id="logout" class="btn ghost" type="button">Sign out</button>
  </div>
  <div class="alt"><a href="index.html">Back to home</a></div>
</div>
<script>
document.getElementById('logout').addEventListener('click', function () {
  window.location.href = 'index.html';
});
</script>
</body>
</html>
